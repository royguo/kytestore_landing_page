server {
    listen 80;
    server_name kytestore.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kytestore-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 308 https://kytestore.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name kytestore.com;

    ssl_certificate /etc/letsencrypt/live/kytestore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kytestore.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/kytestore-site/current;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    add_header X-KyteStore-Origin aliyun-ecs always;
    add_header X-Content-Type-Options nosniff always;

    # Use the original request when redirecting old linked HTML paths.
    if ($request_uri ~ "^/(?<page_path>whitepaper|blog(?:/[^/?]+)?)\.html(?:\?|$)") {
        return 308 /$page_path$is_args$args;
    }

    location = /blog/ { return 308 /blog$is_args$args; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
